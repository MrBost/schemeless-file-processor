spring.application.name=schemaless-file-processor-test

# ── DataSource ────────────────────────────────────────────────────────────────
# Keep the datasource config so Spring does not fail on missing required
# properties, but the actual connection is never made because JPA auto-config
# is excluded via spring.autoconfigure.exclude below.
spring.datasource.url=jdbc:postgresql://localhost:5432/file_processor
spring.datasource.username=postgres
spring.datasource.password=p@55w0rd

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=false

# ── Auto-configuration exclusions ────────────────────────────────────────────
# Disable all infrastructure auto-configs that require live connections.
# Repositories and EntityManager are mocked in the test class instead.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

# ── Kafka ─────────────────────────────────────────────────────────────────────
# @EmbeddedKafka (declared in the test class) sets spring.embedded.kafka.brokers
# at runtime; this placeholder prevents a startup failure when that annotation
# is absent.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
app.kafka.topic.upload-completed=upload-completed

# ── Actuator / health ─────────────────────────────────────────────────────────
management.health.redis.enabled=false
management.health.kafka.enabled=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health,info

# ── File upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.storage.location=./test-uploads
app.file.storage.max-size-mb=10
app.file.allowed-types=csv,xlsx,xls

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration=3600000

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.bost.etl=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
