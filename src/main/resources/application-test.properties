# Test profile - disable external dependencies
spring.application.name=schemaless-file-processor-test

# Server Configuration
server.port=8070
server.servlet.context-path=/api/v1

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Kafka disabled for testing
app.kafka.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# File Storage Configuration
app.file.storage.location=./uploads
app.file.storage.max-size-mb=50
app.file.allowed-types=csv,xlsx,xls

# JWT Configuration
app.jwt.secret=test-secret-key-for-testing-purposes-only-32chars
app.jwt.expiration=86400000

# Disable Redis for testing
spring.cache.type=none